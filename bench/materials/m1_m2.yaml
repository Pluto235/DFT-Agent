# M1 + M2 候选材料清单
# 来源：杨博 2026-04-23 会议文档 (user_input/2026-04-23_jingyang_meeting.md)
# 用途：第一期 182 题生成脚本的输入
#
# 每个材料的字段：
#   id                        全局唯一 ID（格式 Mx_<formula>[_<polymorph>]）
#   formula                   化学式（原格式，与 GBRV family key 对应）
#   name                      人类可读名
#   structure_hint            结构类型口语描述（喂给 prompt 模板）
#   space_group               Hermann-Mauguin 符号（如 Fd-3m）
#   space_group_number        整数 1–230
#   atoms_per_primitive_cell  原胞原子数
#   mp_id                     Materials Project ID（未知时留 null，由生成脚本根据
#                             formula + space_group_number 查询补齐）
#   notes                     特殊说明或警告
#
# 生成脚本应：
#   1. 读本 YAML
#   2. 对每个 material × task (T1, T2)：
#      - 若 mp_id==null：用 pymatgen MPRester 按 formula + space_group_number 查询并锁定
#      - 从 MP 拉 initial_structure (lattice + atomic_positions)
#      - 基于 formula 自动推出元素集 → 生成 pseudopotential.files dict
#      - render schema v1.2 JSON 输出到 bench/questions/Mi_Tj/<id>_<task>.json
#   3. 把解析后的 mp_id 回写进 m1_m2_resolved.yaml 便于复现

