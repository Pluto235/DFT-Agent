  # - 0425 MP cross-validation via bench/materials/resolve.py:
  #   - 70 materials VERIFIED (YAML matched MP authoritative values).
  #   - 11 Claude-vs-MP conflicts: auto-accepted MP values per rule (MP wins
  #     when YAML value was Claude's best guess without Yang specification).
  #     Affected: M1_CdSe (zb not wz), M1_Rb (mp-70), M1_Sr (hcp not fcc),
  #     M1_In (fcc not bct), M2_WO3 (P2_1/c not P2_1/n), M2_Sr3AlSb3 (Cmce),
