  #     - Ti3O5 / Coesite / Spodumene → atoms = MP primitive (Option A)
  #     - Li4SiO4 dropped (Option C) — no matching MP entry at 18 atoms
  #     - FeCr σ-phase dropped (Option C) — MP has no σ-phase FeCr

  BN_polymorph_ambiguity:
    description: "Yang wrote 'BN (Hexagonal or Cubic Boron Nitride)' without specifying."
    resolution: "defaulted to hexagonal h-BN (P6_3/mmc, SG 194, layered)"
    alternative: "cubic c-BN (F-43m, SG 216, zincblende-like) — both technologically relevant"
    confirmation_needed: true

  magnetic_materials_in_M2:
    description: >
      5 M2 materials contain 3d transition metals with magnetic ground states
      (Fe, Co, Mn, Cr): LiFePO4, LiCoPO4, LiMnPO4, FeCr σ-phase, CeFe4Sb12.
      Categorizing these as M2 (structural complexity) instead of M3 (magnetism)
      implies Yang wants paramagnetic PBE treatment. Future M3 redo may switch
      to nspin=2.
    resolution: "paramagnetic PBE; to be revisited in M3 extension"

  mp_id_resolution:
    description: >
      Only ~40 of 91 materials have mp_id filled. Others need query script to
      resolve by formula + space_group_number and write back to this file.
    resolution: "generation script's first pass should be MP resolution; output m1_m2_resolved.yaml"
