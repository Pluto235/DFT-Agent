# M1: Standard GGA/LDA materials
# 来源：杨博 2026-04-23 材料分类（见 user_input/2026-04-23_jinyang_meeting.md）
# 总数：62 种
#
# 单条字段说明：
#   id: 唯一标识，也作为生成题目的文件名前缀（M1 内唯一）。多态同 formula 用后缀区分（如 Sn_alpha / Sn_beta）
#   formula: MP 查询用的化学式（不带空格）
#   subclass: 按杨博清单的子类分组，用于后续分析
#   expected_space_group: 国际符号（用 ASCII 连字符代 U+2212，如 "Fd-3m"）。null 表示不强制匹配，由 energy_above_hull 决定
#   expected_atoms_per_primitive_cell: 整数。null 表示不校验
#   polymorph_note: 原义透明描述，给生成脚本和 reviewer 看
#   mp_id_hint: 已知 MP ID（可选）；null 由脚本查询决定

