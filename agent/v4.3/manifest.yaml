# dft-agent-bench external agent manifest
# Contract: ../WarpAgentLab/agent/agents-api.md
#
# Bench validates this with Pydantic on register; missing/wrong-typed
# required fields → 422 before smoke runs.

# --- required ---
id: warpagent-qe-v4-3
name: "WarpAgent QE v4.3"
description: >
  Planner Orchestrator + Executor/Verifier subagents. Inherits v4.1's
  preflight subagents (config_advisor + T2 vc_relax pre-relax).
  Magentic-One-style dual ledger with retry/replan. Supports both
  Anthropic API (bench) and DeepSeek/openai-compat (local dev).
  Supported: vc_relax, bands_dos.
entrypoint: solve.py

# --- optional but recommended ---
version: "0.4.3"

# extra args bench transparently appends to every solver subprocess invocation.
# Bench runs all roles on Claude; local dev defaults to DeepSeek via providers.yaml.
default_args:
  - "--planner-model"
  - "claude-sonnet-4-6"
  - "--executor-model"
  - "claude-sonnet-4-6"
  - "--verifier-model"
  - "claude-haiku-4-5-20251001"
  - "--config-advisor-model"
  - "claude-haiku-4-5-20251001"
  - "--prerelax-model"
  - "claude-sonnet-4-6"

# bench will not dispatch task types outside this list
supported_task_types: [vc_relax, bands_dos]

python_requires: ">=3.10"

# review-only — bench does NOT pip install (audit blocks network)
declared_deps:
  - "anthropic>=0.40"
  - "pyyaml"

# smoke = registration verification: bench runs these tasks
# pass_threshold: at least one task total_score >= threshold → register passes
# We use cheap haiku for smoke ($0.02-0.05/task); leaderboard runs use the
# default_args model (sonnet-4-6).
smoke:
  task_ids:
    - M1_T1_Si_vc_relax
  model: claude-haiku-4-5-20251001
  pass_threshold: 0.5
  timeout_per_task_sec: 1800
